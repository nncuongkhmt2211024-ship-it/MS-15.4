server:
  port: 8080

spring:
  application:
    name: Api_Gateway
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-System-Name, Api-Gateway-System
      routes:
        - id: customer-service-route
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/